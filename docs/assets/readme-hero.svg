      <text x="261" y="419" text-anchor="middle">切换会话</text>
      <rect x="338" y="395" width="126" height="36" rx="18" fill="#343447" stroke="#595575"/>
      <text x="401" y="419" text-anchor="middle">自由映射</text>
    </g>
    <text x="58" y="483" fill="#8d99af" font-size="13" letter-spacing="1.4">OPEN SOURCE / GPL-3.0-ONLY / BUILT FOR WINDOWS</text>
  </g>
