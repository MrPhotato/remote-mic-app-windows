    <text x="79" y="77" fill="#f0f1fc" font-size="28" font-weight="700">无线麦 <tspan fill="#aba8f8">SayAll</tspan></text>
    <text x="58" y="115" fill="#9ba6bc" font-size="13" letter-spacing="3">WINDOWS · REMOTE + VOICE</text>
    <text x="53" y="215" fill="#f4f5ff" font-size="62" font-weight="700">说出想法，</text>
    <text x="53" y="293" fill="#f4f5ff" font-size="62" font-weight="700">按下下一步。</text>
    <text x="58" y="345" fill="#bdc5d9" font-size="21">把小米蓝牙遥控器，变成语音与快捷操作入口。</text>
    <g font-size="15" fill="#d9def0">
