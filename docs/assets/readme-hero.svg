<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">无线麦 SayAll Windows 版：说出想法，按下下一步</title>
  <desc id="desc">靛紫与薄荷绿背景上的银灰遥控器插画，展示按住说话、切换会话与自由映射。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#22213f"/><stop offset=".6" stop-color="#101522"/><stop offset="1" stop-color="#143634"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9690ff" stop-opacity=".25"/><stop offset="1" stop-color="#9690ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="silver"><stop stop-color="#8f949e"/><stop offset=".12" stop-color="#f2f2ee"/><stop offset=".4" stop-color="#d7d9dc"/><stop offset=".9" stop-color="#b7bdc5"/><stop offset="1" stop-color="#777f8a"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#343450"/><stop offset="1" stop-color="#16232f"/></linearGradient>
  </defs>
  <rect width="1200" height="530" rx="28" fill="url(#bg)"/>
  <ellipse cx="250" cy="145" rx="540" ry="360" fill="url(#glow)"/>
  <g fill="none" stroke="#96a9ce" opacity=".10"><path d="M690 0v530M830 0v530M970 0v530M1110 0v530"/><path d="M665 105h535M665 245h535M665 385h535"/></g>
