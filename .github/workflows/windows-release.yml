name: Windows Release

# 独立 Windows fork 的完整签名预览包。不会启用应用内自动更新。
# release:preview PR 经 Preview CD 合并后创建 Tag、签名、下载核验并公开。
# GITHUB_TOKEN 创建的 Tag 不会再次触发 push；构建在同一工作流继续。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: '发布或恢复当前 main 的预览版（例如 v0.3.4）'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: windows-preview-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      tag: ${{ steps.plan.outputs.tag }}
      source: ${{ steps.plan.outputs.source }}
      existing: ${{ steps.plan.outputs.existing }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release intent and immutable version
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: ./scripts/prepare-preview-release.ps1 -RequestedTag $env:REQUESTED_TAG

  release:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}

      - name: Require current main and successful merged PR CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve main' }
          $source = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($source -ne $main) { throw 'Release tag must name current origin/main exactly' }
          $prs = gh api "repos/$env:GITHUB_REPOSITORY/commits/$source/pulls" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify merged PR' }
          $matched = @($prs | Where-Object { $_.merged_at -and $_.base.ref -eq 'main' -and $_.merge_commit_sha -eq $source })
          if ($matched.Count -ne 1) { throw 'Expected one merged main PR for this source' }
          $head = $matched[0].head.sha
          $prNumber = [long]$matched[0].number
          . ./scripts/release-source-gates.ps1
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/windows-ci.yml/runs?event=pull_request&head_sha=$head&per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify PR CI result' }
          $latest = Select-LatestPrCiRun $runs $head $prNumber
          # Read the selected run again so a newer rerun attempt cannot use its old green result.
          $verified = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($latest.id)" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify latest PR CI attempt' }
          Assert-LatestPrCiPassed $verified $latest $head $prNumber
          if (!@($latest.pull_requests | Where-Object { $null -ne $_ }).Count -or !@($verified.pull_requests | Where-Object { $null -ne $_ }).Count) {
            $checkoutLog = (gh run view $verified.id --repo $env:GITHUB_REPOSITORY --attempt $verified.run_attempt --log) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read CI checkout proof' }
            $testedSha = Get-TestedMergeSha $checkoutLog $prNumber
            $testedCommit = gh api "repos/$env:GITHUB_REPOSITORY/git/commits/$testedSha" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify tested commit identity' }
            $sourceTree = (git rev-parse "$source^{tree}").Trim()
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release tree' }
            Assert-TestedMergeTree $testedCommit $testedSha $head $sourceTree
            $confirmed = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($verified.id)" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $confirmed.run_attempt -ne $verified.run_attempt) { throw 'CI attempt changed during proof verification' }
            Assert-LatestPrCiPassed $confirmed $latest $head $prNumber
            Write-Host "Verified merged PR association via checkout log and exact tree: tested=$testedSha tree=$sourceTree"
          }
          Write-Host "Verified source=$source pr=$prNumber head=$head ci_run=$($verified.id) attempt=$($verified.run_attempt) conclusion=success"

      - name: Create immutable tag after source verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/release-cd-common.ps1
          $source = (git rev-parse HEAD).Trim()
          $existing = Get-ReleaseTagSource $env:RELEASE_TAG
          if ($existing -and $existing -cne $source) { throw 'Tag source mismatch' }
          if (!$existing) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$source" --silent
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create tag; inspect outcome before retry' }
          }
          if ((Get-ReleaseTagSource $env:RELEASE_TAG) -cne $source) { throw 'Tag readback mismatch' }

      - uses: pnpm/action-setup@v4
        if: needs.prepare.outputs.existing != 'true'
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        if: needs.prepare.outputs.existing != 'true'
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        if: needs.prepare.outputs.existing != 'true'
        with:
          python-version: '3.11.9'
          architecture: x64

      - name: Install frontend dependencies
        if: needs.prepare.outputs.existing != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secret is present
        if: needs.prepare.outputs.existing != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "缺少 TAURI_SIGNING_PRIVATE_KEY 仓库 Secret：正式 Release 必须用正式更新签名密钥构建（私钥丢失即无法再向存量用户推送更新，请先在 GitHub Secrets 配置并本地备份私钥）"
          }
          Write-Host "正式更新签名密钥已就绪"

      - name: Build complete signed NSIS preview installer
        if: needs.prepare.outputs.existing != 'true'
        shell: pwsh
        run: ./scripts/build-local.ps1 -SkipTests -Installer -BuildChannel preview -ReleaseTag $env:RELEASE_TAG -CreateUpdaterArtifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密码变量缺失时 tauri build 会交互式等待输入（无 TTY 的 CI 上挂死，
          # 2026-09-06 本机矩阵实验实证）；正式密钥为无密码密钥，Secret 未配置时
          # 此处求值为空字符串，实测空字符串 + 无密码密钥可免交互完成签名。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify production build and complete helper payload
        if: needs.prepare.outputs.existing != 'true'
        shell: pwsh
        run: |
          ./scripts/verify-runtime-simulation-isolation.ps1
          ./scripts/verify-windows-bundle.ps1
          ./scripts/verify-rc003-helper-bundle.ps1 -ExpectedManifestPath target/rc003-helper/manifest.json

      - name: Generate updater manifest and stage release assets
        if: needs.prepare.outputs.existing != 'true'
        shell: pwsh
        run: |
          ./scripts/generate-updater-manifest.ps1 -Tag $env:RELEASE_TAG -Repository $env:GITHUB_REPOSITORY
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $asset = "artifacts/windows-release/SayAll-Windows-$version-x64-setup.exe"
          cargo run --release --locked --manifest-path tools/release-signature-verify/Cargo.toml -- $asset "$asset.sig" artifacts/windows-release/release-signing.pub
          if ($LASTEXITCODE -ne 0) { throw 'Release signature verification failed' }

      - name: Show staged assets before release (delete-free verification)
        if: needs.prepare.outputs.existing != 'true'
        shell: pwsh
        run: |
          Write-Host "将上传到 Draft Release $env:RELEASE_TAG 的资产清单："
          Get-ChildItem -LiteralPath "artifacts/windows-release" -File |
            ForEach-Object { Write-Host ("- {0} ({1} bytes) SHA256={2}" -f $_.Name, $_.Length, (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) }

      - name: Create draft GitHub release with assets
        if: needs.prepare.outputs.existing != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = Get-ChildItem -LiteralPath "artifacts/windows-release" -File | ForEach-Object { $_.FullName }
          $notes = "releases/$tag.md"
          if (!(Test-Path -LiteralPath $notes)) { throw 'Versioned release notes are missing' }
          gh release create $tag --verify-tag --draft --prerelease --title "无线麦 SayAll Windows $tag Preview" --notes-file $notes @assets
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create 失败（exit $LASTEXITCODE；若 Release 已存在请人工核对后处理，本流程不做任何删除/覆盖）"
          }
          Write-Host "Draft Preview $tag 已创建，继续下载核验；应用自动更新仍关闭"

      - name: Download verify and publish preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-verified-preview.ps1 -Tag $env:RELEASE_TAG

      - name: Retain verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: artifacts/release-verification.json
          if-no-files-found: ignore

      - name: Explain failed delivery
        if: failure()
        shell: pwsh
        run: |
          "## Preview 发布未完成`n`n失败步骤见本次运行日志。已有 Tag 和附件保留；重跑只核验已有完整资产，不覆盖或重新签名。" >> $env:GITHUB_STEP_SUMMARY
