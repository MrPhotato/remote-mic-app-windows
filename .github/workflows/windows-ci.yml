name: Windows CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Testing/**'
      - 'artifacts/**'
      - 'Screenshots/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test release automation gates
        shell: pwsh
        run: |
          ./scripts/test-release-cd.ps1
          ./scripts/test-preview-cd.ps1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build setup frontend
        run: pnpm setup:build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test release signature verifier
        run: cargo test --locked --manifest-path tools/release-signature-verify/Cargo.toml

      - name: Test helper bundle verification gates
        shell: pwsh
        run: ./scripts/test-rc003-helper-bundle.ps1

      - name: Test final setup bundle receipt gates
        shell: pwsh
        run: ./scripts/test-setup-bundle-gates.ps1

      - name: Test release source verification gates
        shell: pwsh
        run: ./scripts/test-release-source-gates.ps1

      - name: Test preview release request and asset gates
        shell: pwsh
        run: |
          ./scripts/test-preview-release-request.ps1
          ./scripts/test-release-cd.ps1

      - name: Build and test RC003 helper
        shell: pwsh
        run: ./scripts/build-rc003-helper.ps1

      - name: Test Rust workspace
        run: |
          cargo test --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p sayall-windows-app --features runtime-simulation microphone::tests::simulation_

      - name: Check Windows Tauri host
        run: cargo check --workspace

      - name: Build Windows runtime simulation
        shell: pwsh
        run: |
          $env:VITE_SAYALL_RUNTIME_SIMULATION = "1"
          pnpm tauri build --no-bundle --features runtime-simulation

      - name: Test Windows Tauri WebView and IPC runtime simulation
        id: runtime-simulation
        shell: pwsh
        timeout-minutes: 3
        run: ./scripts/test-windows-runtime-simulation.ps1

      - name: Preserve failed runtime simulation report
        if: failure() && steps.runtime-simulation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-simulation-failure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sayall-runtime-simulation-*.json
            ${{ runner.temp }}/sayall-runtime-simulation-*.stdout.log
            ${{ runner.temp }}/sayall-runtime-simulation-*.stderr.log
          if-no-files-found: warn
          retention-days: 14

      - name: Build predecessor NSIS upgrade fixture
        shell: pwsh
        run: ./scripts/build-windows-upgrade-fixture.ps1

      - name: Build unsigned NSIS preview installer
        shell: pwsh
        run: ./scripts/build-local.ps1 -SkipTests -SkipHelperBuild -Installer -BuildChannel ci-preview

      - name: Verify complete RC003 helper bundle
        shell: pwsh
        run: ./scripts/verify-rc003-helper-bundle.ps1

      - name: Verify runtime simulation is absent from production build
        shell: pwsh
        run: ./scripts/verify-runtime-simulation-isolation.ps1

      - name: Verify installer identity and create checksums
        shell: pwsh
        run: ./scripts/verify-windows-bundle.ps1

      - name: Verify setup shortcut choices
        shell: pwsh
        run: ./scripts/test-setup-shortcut-choice.ps1 -MakensisPath "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe"

      - name: Verify setup command forwarding
        shell: pwsh
        run: ./tools/setup-bootstrap/test-forwarding.ps1 -MakensisPath "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe"

      - name: Verify NSIS application byte capture
        shell: pwsh
        timeout-minutes: 3
        run: ./scripts/test-setup-app-capture.ps1 -MakensisPath "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe"

      - name: Verify custom setup directory and desktop shortcut
        shell: pwsh
        timeout-minutes: 3
        run: ./scripts/test-setup-directory-install.ps1 -MakensisPath "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe"

      - name: Test install upgrade downgrade and uninstall matrix
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-windows-install-lifecycle-matrix.ps1

      - name: Test silent current-user install and uninstall
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/test-windows-silent-install.ps1

      - name: Verify installer stops when graceful exit times out
        shell: pwsh
        run: ./scripts/test-installer-exit-timeout.ps1 -MakensisPath "$env:LOCALAPPDATA/tauri/NSIS/makensis.exe"

      - name: Test installer graceful exit while the app is running
        shell: pwsh
        timeout-minutes: 12
        run: ./scripts/test-windows-installer-graceful-exit.ps1

      - name: Upload unsigned preview installer
        uses: actions/upload-artifact@v4
        with:
          name: sayall-windows-unsigned-preview-${{ github.sha }}
          path: artifacts/windows-preview/
          if-no-files-found: error
          retention-days: 14
